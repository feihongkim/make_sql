# 차트를 그릴 수 있는 테이블 목록.
#
# 여기 등록된 것만 그린다. 새 테이블이 필요하면 항목을 추가하면 되고,
# 컬럼 이름이 달라도 Go/Python 코드는 고치지 않는다.
#
# DB 접속은 조회 전용 계정(chart_ro)을 쓴다. 자격증명은 환경변수로 주입한다
# (~/.secrets/mssql_chart_ro.env → run_chart.sh 가 읽어 넘긴다).

servers:
  white:
    # 차트 컨테이너에서 호스트의 mssql 컨테이너(1433 publish)로 나간다.
    # extra_hosts 로 host.docker.internal 을 host-gateway 에 연결해 둔다.
    host: host.docker.internal
    port: 1433
  TUF:
    host: 100.127.179.112     # Tailscale
    port: 1433

sources:
  # 국내 주식 일봉 — 1985~ , 1,500만 건
  kor_daily:
    server: white
    db: hannam
    table: dbo.STOCK_PRICE_KOR_D001
    symbol: SHCODE
    date: "DATE"              # nvarchar 'YYYYMMDD'
    open: "OPEN"
    high: "HIGH"
    low: "LOW"
    close: "CLOSE"
    volume: VOLUME
    where: "STICK_TYPE = 'D001'"
    # 제목에 종목명을 붙인다. {name} 이 비면 코드만 나온다.
    name: { table: dbo.STOCK_CODE, key: SHCODE, value: NAME }
    title: "{symbol} {name} 일봉"

  # 해외 주식 일봉
  foreign_daily:
    server: white
    db: hannam
    table: dbo.ForeignStockDaily
    symbol: SHCODE
    date: "DATE"
    open: "OPEN"
    high: "HIGH"
    low: "LOW"
    close: "CLOSE"
    volume: VOLUME
    title: "{symbol} (해외) 일봉"

  # LS증권 일봉 (XingAPI t8410)
  # in_gubun 은 조회 구분 — 2 가 일봉이다. 안 걸면 주/월봉이 섞인다.
  # 종목 컬럼이 응답이 아니라 요청 파라미터(in_shcode)라는 점에 주의.
  ls_daily:
    server: white
    db: LS
    table: ST.t8410
    symbol: in_shcode
    date: "date"
    open: "open"
    high: "high"
    low: "low"
    close: "close"
    volume: jdiff_vol        # 거래량
    where: "in_gubun = '2'"
    title: "{symbol} 일봉 (LS)"

  # KIS 국내주식 기간별 시세
  # period_type: D(일)/W(주)/M(월). 현재 적재된 것은 D 뿐이지만 명시해 둔다.
  kis_daily:
    server: TUF
    db: KIS2
    table: DM.BP_PeriodPrice
    symbol: stck_shrn_iscd
    date: stck_bsop_date
    open: stck_oprc
    high: stck_hgpr
    low: stck_lwpr
    close: stck_clpr
    volume: acml_vol
    where: "period_type = 'D'"
    title: "{symbol} 일봉 (KIS)"

  # 업종 지수 (193종)
  # SHCODE 가 3자리 숫자 코드라 이름 없이는 못 읽는다 → UPJONG_CODE 로 조회한다.
  # ⚠️ 2026-06-05 에서 적재가 멈춰 있다. 최근 구간은 비어 있다.
  upjong_daily:
    server: white
    db: hannam
    table: dbo.upjongDaily
    symbol: SHCODE
    date: "DATE"
    open: "OPEN"
    high: "HIGH"
    low: "LOW"
    close: "CLOSE"
    volume: VOLUME
    name: { table: dbo.UPJONG_CODE, key: UPCODE, value: HNAME }
    title: "{symbol} {name} (업종지수)"
